<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Life Care Hospital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js"></script>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><span class="logo-icon"><img src="2.TIFT.png" alt="Life Care Hospital logo" /></span><span class="logo-text">Life Care Hospital</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="appointment.html" class="btn-book">Book Appointment</a></li>
            </ul>
        </div>
    </nav>

    <div class="page">
        <div class="card login-card">
            <h1 class="section-title">Admin Login</h1>
            <p class="section-subtitle">Use your admin credentials to view submissions.</p>
            <div id="loginError" class="status error" style="display:none;"></div>
            <form id="loginForm" class="form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required />
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
